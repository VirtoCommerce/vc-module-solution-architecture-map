<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Interactive Solution Map">
  <title>Interactive Solution Map</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#5FC8F5"/>
      <stop offset="100%" stop-color="#265FC6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B3F66" flood-opacity="0.30"/>
    </filter>
    <clipPath id="globe"><circle cx="0" cy="0" r="40"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Glyph: world solution map - globe with region nodes + data flows -->
  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- globe -->
    <circle cx="0" cy="0" r="40" fill="#FFFFFF"/>
    <g clip-path="url(#globe)" fill="none" stroke="#8FC0F2" stroke-width="2.5">
      <ellipse cx="0" cy="0" rx="40" ry="14"/>
      <ellipse cx="0" cy="0" rx="14" ry="40"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
    </g>

    <!-- data-flow arcs between regions -->
    <g fill="none" stroke="#2C6BD6" stroke-width="3.5" stroke-linecap="round">
      <path d="M-20,-13 Q -2,-27 18,-15"/>
      <path d="M18,-15 Q 22,4 10,19"/>
    </g>

    <!-- region nodes (one highlighted = active incident) -->
    <circle cx="-20" cy="-13" r="6"   fill="#3FD8B4" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="18"  cy="-15" r="6"   fill="#FFC24D" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="10"  cy="19"  r="7"   fill="#E5484D" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
</svg>
